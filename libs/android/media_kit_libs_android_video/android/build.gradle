import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
    }

    sourceSets {
        main {
            jniLibs.srcDirs += ["$buildDir/output/jniLibs"]
        }
    }
}

def libmpvAndroidVersion = "v1.0.0"
def mediaKitHelperVersion = "v1.1.7"

def downloadAndVerify = { String url, String md5, File destination ->
    if (destination.exists()) {
        def existingMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destination.toPath())).encodeHex().toString()
        if (existingMD5 != md5) {
            destination.delete()
            println "MD5 mismatch. File deleted: ${destination}"
        }
    }

    if (!destination.exists()) {
        destination.parentFile.mkdirs()
        println "Downloading file from: ${url}"
        destination.withOutputStream { os ->
            os << new URL(url).openStream()
        }

        def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destination.toPath())).encodeHex().toString()
        if (calculatedMD5 != md5) {
            throw new GradleException("MD5 verification failed for ${destination}")
        }
    }

    return destination
}

task downloadDependencies(type: Exec) {
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        def jniLibsDir = file("$buildDir/output/jniLibs")

        // libmpv, FFmpeg & libc++_shared for every ABI.
        def libmpvAar = downloadAndVerify(
            "https://github.com/jarnedemeulemeester/libmpv-android/releases/download/${libmpvAndroidVersion}/libmpv-release.aar",
            "5bcadb5d91119052ea803e1bef74c63f",
            file("$buildDir/libmpv-android/${libmpvAndroidVersion}/libmpv-release.aar")
        )

        copy {
            from zipTree(libmpvAar)
            into jniLibsDir
            include "jni/**/*.so"
            // JNI glue for dev.jdtech.mpv.MPVLib, which media_kit does not use.
            exclude "**/libplayer.so"
            eachFile { it.path = it.path.replaceFirst("^jni/", "") }
            includeEmptyDirs = false
        }

        // libmediakitandroidhelper.so for every ABI
        [
            ["abi": "arm64-v8a", "md5": "83df25b61193af8fa815e373143ac9af"],
            ["abi": "armeabi-v7a", "md5": "22e21526fefc0a2b8f17adbec9f57590"],
            ["abi": "x86_64", "md5": "6fa26bf0459b11f1c0b0dbc29e5b940d"],
            ["abi": "x86", "md5": "0d742b756dc9d1fcd84ea271d8b68f32"]
        ].each { helper ->
            def jar = downloadAndVerify(
                "https://github.com/media-kit/libmpv-android-video-build/releases/download/${mediaKitHelperVersion}/default-${helper.abi}.jar",
                helper.md5,
                file("$buildDir/${mediaKitHelperVersion}/default-${helper.abi}.jar")
            )

            copy {
                from zipTree(jar)
                into jniLibsDir
                include "lib/**/libmediakitandroidhelper.so"
                eachFile { it.path = it.path.replaceFirst("^lib/", "") }
                includeEmptyDirs = false
            }
        }
}

assemble.dependsOn(downloadDependencies)
